name: Terraform CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Terraform Init
      run: terraform init
      working-directory: ./terraform

    - name: Terraform Plan
      if: github.event_name == 'pull_request'
      run: terraform plan -no-color -refresh=false
      working-directory: ./terraform

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -auto-approve -refresh=false
      working-directory: ./terraform

    - name: Configure kubectl
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: aws eks update-kubeconfig --region us-east-1 --name project-bedrock-cluster

    - name: Deploy Kubernetes manifests
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        kubectl apply -f kubernetes/namespace.yaml
        kubectl apply -f kubernetes/rbac.yaml
        kubectl apply -f kubernetes/ingress.yaml

    - name: Adopt existing resources for Helm
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        kubectl get all,secret,configmap -n retail-app -o name 2>/dev/null | while read resource; do
          kubectl annotate "$resource" -n retail-app \
            meta.helm.sh/release-name=innovatemart-retail-store \
            meta.helm.sh/release-namespace=retail-app \
            --overwrite 2>/dev/null || true
          kubectl label "$resource" -n retail-app \
            app.kubernetes.io/managed-by=Helm \
            --overwrite 2>/dev/null || true
        done

    - name: Deploy application via Helm
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        helm upgrade --install innovatemart-retail-store helm/innovatemart-retail-store \
          -f helm/innovatemart-retail-store/values.yaml \
          --namespace retail-app \
          --create-namespace
